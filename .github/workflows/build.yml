name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Image with Visual Studio 2026 (PlatformToolset v145)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild HEW2026.slnx /m /nologo
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:VcpkgEnableManifest=false

      # Keep the x64/Release layout so the game's "../../assets/" paths still resolve
      - name: Package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $bin = "dist/HEW2026/x64/Release"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item x64/Release/*.exe, x64/Release/*.cso -Destination $bin
          if (Test-Path assets) { Copy-Item assets "dist/HEW2026/assets" -Recurse }
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Upload build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: HEW2026-Release
          path: dist/HEW2026

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HEW2026-Release
          path: HEW2026

      - name: Zip
        run: zip -r HEW2026-${{ github.ref_name }}.zip HEW2026

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          HEW2026-${{ github.ref_name }}.zip
          --repo ${{ github.repository }}
          --generate-notes
